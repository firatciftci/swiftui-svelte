name: __APP_NAME__
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  SvelteSwiftUI:
    url: https://github.com/firatciftci/swiftui-svelte
    from: 99.99.99
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  __APP_NAME__:
    type: application
    platform: iOS
    sources:
      - path: __APP_NAME__
        excludes:
          - JavaScript
          - JavaScript/**
      - path: __APP_NAME__/JavaScript
        type: folder
    dependencies:
      - package: SvelteSwiftUI
    preBuildScripts:
      - name: Bundle the JavaScript
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ] || [ ! -f "$SRCROOT/__APP_NAME__/JavaScript/app.js" ]; then
            export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
            cd "$SRCROOT/.." && npm run build
          fi
    info:
      path: __APP_NAME__/Info.plist
      properties:
        CFBundleDisplayName: __APP_NAME__
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: __APP_NAME__ loads its JavaScript from the Vite dev server on your Mac while you develop.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
