name: SvelteHost
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  SvelteSwiftUI:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  SvelteHost:
    type: application
    platform: iOS
    sources:
      - path: SvelteHost
        excludes:
          - Resources/**
      - path: SvelteHost/Resources
        buildPhase: resources
    dependencies:
      - package: SvelteSwiftUI
    configFiles:
      Debug: SvelteHost.xcconfig
      Release: SvelteHost.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    scheme: {}
