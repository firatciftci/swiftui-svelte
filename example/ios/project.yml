name: SvelteHost
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  SvelteSwiftUI:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  SvelteHost:
    type: application
    platform: iOS
    sources:
      - path: SvelteHost
        excludes:
          - Resources/**
      - path: SvelteHost/Resources
        buildPhase: resources
    dependencies:
      - package: SvelteSwiftUI
    configFiles:
      Debug: SvelteHost.xcconfig
      Release: SvelteHost.xcconfig
    info:
      path: SvelteHost/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: The example app loads its JavaScript from the Vite dev server on your Mac while you develop.
        NSCameraUsageDescription: The example app uses the camera to take a photo when you tap Take photo.
        CFBundleLocalizations:
          - en
          - ar
        CFBundleURLTypes:
          - CFBundleURLName: com.example.SvelteHost
            CFBundleURLSchemes:
              - sveltehost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - SvelteHostUITests
  SvelteHostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SvelteHostUITests
    dependencies:
      - target: SvelteHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SvelteHostUITests
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
