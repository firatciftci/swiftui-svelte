name: Bug report
description: Something doesn't render or behave the way the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug. A small reproduction gets it fixed much faster. If it's a security problem, report it privately instead: https://github.com/firatciftci/swiftui-svelte/security/advisories/new"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include any error messages from Xcode's console or the red error overlay, and a screenshot if something looks wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a repository, or the smallest Svelte component that shows the problem.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Run `npm ls swiftui-svelte svelte vite` and paste the output, then add your Xcode version and the iOS version of the device or simulator.
      render: text
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Where does it go wrong?
      description: Your best guess is fine. It helps to know whether the JavaScript side or the SwiftUI side is at fault.
      options:
        - The Svelte app doesn't build or type-check
        - The app builds, but something renders or behaves wrong on iOS
        - I don't know
      default: 2
    validations:
      required: true
