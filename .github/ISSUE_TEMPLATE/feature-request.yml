name: Feature request
description: Suggest a new element, attribute, or API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to build and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The element, attribute, or API you have in mind, and the SwiftUI view or modifier it would map to. Code examples help.
    validations:
      required: true
