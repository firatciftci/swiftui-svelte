name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install tools
        run: brew bundle

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun swift-format --version
          swiftlint version
          xcodegen --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format

      - name: Check types
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Test the JS package
        run: pnpm run test:coverage

      - name: Check that the conformance fixtures are up to date
        run: git diff --exit-code -- Tests/SvelteSwiftUITests/Fixtures

      - name: Test the Swift package
        run: xcrun swift test --enable-code-coverage

      - name: Build the package
        run: pnpm run package

      - name: Bundle the example app
        run: pnpm run build

      - name: Build the Swift package and the example app
        run: |
          mkdir -p build
          pnpm run ios:project
          if ! xcodebuild build \
            -project example/ios/SvelteHost.xcodeproj \
            -scheme SvelteHost \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO > build/xcodebuild.log 2>&1; then
            sed -nE '/(error|warning):/p' build/xcodebuild.log | sort -u
            tail -n 20 build/xcodebuild.log
            exit 1
          fi

      - name: Analyze the Swift code
        run: swiftlint analyze --strict --quiet --compiler-log-path build/xcodebuild.log

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
