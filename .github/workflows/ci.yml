name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install tools
        run: brew bundle

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun swift-format --version
          swiftlint version
          xcodegen --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format

      - name: Check types
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Test the JS package
        run: pnpm run test:coverage

      - name: Build the Swift test bundle
        run: pnpm run fixtures

      - name: Check that the test fixtures are up to date
        run: git diff --exit-code -- Tests/SvelteSwiftUITests/Fixtures

      - name: Check that the known element names are up to date
        run: pnpm run elements && git diff --exit-code -- src/known.ts

      - name: Check that the template's Xcode project is up to date
        run: pnpm run template && git diff --exit-code -- template

      - name: Test the Swift package
        run: xcrun swift test --enable-code-coverage

      - name: Report Swift coverage
        run: |
          xcrun llvm-cov report \
            .build/debug/SvelteSwiftUITests.xctest/Contents/MacOS/SvelteSwiftUITests \
            -instr-profile .build/debug/codecov/default.profdata \
            -ignore-filename-regex='(Tests|\.build)/'

      - name: Build the package
        run: pnpm run package

      - name: Bundle the example app
        run: pnpm run build

      - name: Build the Swift package and the example app
        run: |
          mkdir -p build
          pnpm run ios:project
          if ! xcodebuild build \
            -project example/ios/SvelteHost.xcodeproj \
            -scheme SvelteHost \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO > build/xcodebuild.log 2>&1; then
            sed -nE '/(error|warning):/p' build/xcodebuild.log | sort -u
            tail -n 20 build/xcodebuild.log
            exit 1
          fi

      - name: Analyze the Swift code
        run: swiftlint analyze --strict --quiet --compiler-log-path build/xcodebuild.log

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

  svelte:
    name: Svelte ${{ matrix.svelte }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        svelte: [5.59.0, ~5.59.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Svelte ${{ matrix.svelte }}
        env:
          SVELTE: ${{ matrix.svelte }}
        run: pnpm add --save-dev "svelte@$SVELTE"

      - name: Check types
        run: pnpm run check

      - name: Test the JS package
        run: pnpm test

  template:
    name: App template
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install tools
        run: brew bundle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack the npm package
        run: |
          mkdir -p build/template
          pnpm pack --pack-destination build/template

      - name: Create an app
        run: |
          tarball="$(ls "$PWD"/build/template/swiftui-svelte-*.tgz)"
          cd build/template
          npx --yes --package "$tarball" swiftui-svelte create hello-app
          cd hello-app
          npm pkg set "devDependencies.swiftui-svelte=file:$tarball"
          npm install --no-audit --no-fund

      - name: Build, check, and lint the app
        working-directory: build/template/hello-app
        run: npm run build && npm run check && npm run lint

      - name: Build the app's Xcode project against this commit
        working-directory: build/template/hello-app/ios
        run: |
          sed -i '' -e "s#url: https://github.com/firatciftci/swiftui-svelte#path: $GITHUB_WORKSPACE#" -e '/^    from: /d' project.yml
          xcodegen generate
          xcodebuild build \
            -project HelloApp.xcodeproj \
            -scheme HelloApp \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../../derived \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    name: UI tests
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install tools
        run: brew bundle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle the example app
        run: pnpm run build

      - name: Generate the Xcode project
        run: pnpm run ios:project

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b

      - name: Run the Swift tests on a simulator
        run: |
          xcodebuild test \
            -scheme SvelteSwiftUI \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/package

      - name: Build the UI tests
        run: |
          xcodebuild build-for-testing \
            -project example/ios/SvelteHost.xcodeproj \
            -scheme SvelteHost \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=

      - name: Run the UI tests on a simulator
        run: |
          xcodebuild test-without-building \
            -project example/ios/SvelteHost.xcodeproj \
            -scheme SvelteHost \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/derived \
            -resultBundlePath build/UITests.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: build/UITests.xcresult
